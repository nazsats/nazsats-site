<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="The playbook: find behaviour specified twice, then find the input where the two copies disagree.">
  <rect width="880" height="300" rx="14" fill="#0f1116"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">THE WHOLE METHOD</text>

  <!-- step 1 -->
  <rect x="40" y="72" width="240" height="132" rx="11" fill="#1a1d25" stroke="#2b303c"/>
  <circle cx="66" cy="98" r="13" fill="#FF5500"/>
  <text x="66" y="103" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <text x="90" y="103" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#fff">Find a duplicate</text>
  <text x="58" y="132" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Somewhere the same rule</text>
  <text x="58" y="150" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">is written down twice:</text>
  <text x="58" y="170" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#7dd3fc">client ↔ server</text>
  <text x="58" y="187" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#7dd3fc">sibling functions</text>

  <!-- step 2 -->
  <rect x="320" y="72" width="240" height="132" rx="11" fill="#1a1d25" stroke="#2b303c"/>
  <circle cx="346" cy="98" r="13" fill="#FF5500"/>
  <text x="346" y="103" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="370" y="103" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#fff">Hunt the edge</text>
  <text x="338" y="132" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">Feed both copies the</text>
  <text x="338" y="150" font-family="system-ui,sans-serif" font-size="12.5" fill="#94a3b8">input nobody tested:</text>
  <text x="338" y="170" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#fbbf24">zero · empty · two</text>
  <text x="338" y="187" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#fbbf24">instead of one</text>

  <!-- step 3 -->
  <rect x="600" y="72" width="240" height="132" rx="11" fill="#101a17" stroke="#10b981" stroke-width="2"/>
  <circle cx="626" cy="98" r="13" fill="#10b981"/>
  <text x="626" y="103" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#06281f" text-anchor="middle">3</text>
  <text x="650" y="103" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#fff">They disagree</text>
  <text x="618" y="132" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">No argument needed —</text>
  <text x="618" y="150" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">one of them is wrong,</text>
  <text x="618" y="170" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">by definition.</text>
  <text x="618" y="190" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#34d399">That&#8217;s your bug.</text>

  <!-- arrows -->
  <g stroke="#3f4653" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M288 138 L312 138"/>
    <path d="M304 130 L312 138 L304 146"/>
    <path d="M568 138 L592 138"/>
    <path d="M584 130 L592 138 L584 146"/>
  </g>

  <!-- footer -->
  <rect x="40" y="228" width="800" height="44" rx="9" fill="#171207" stroke="#4a2a0c"/>
  <text x="440" y="248" font-family="system-ui,sans-serif" font-size="13.5" fill="#fbbf24" text-anchor="middle">You are never reading code hoping to spot something &#8220;wrong&#8221;.</text>
  <text x="440" y="265" font-family="system-ui,sans-serif" font-size="13.5" fill="#cbd5e1" text-anchor="middle">You are looking for two copies of one rule, then the input that separates them.</text>
</svg>
