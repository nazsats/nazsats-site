<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Because zero is falsy, similarity_top_k or embedding_length turns a request for zero results into a request for every result.">
  <rect width="880" height="330" rx="14" fill="#0f1116"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">WHY ASKING FOR 0 RESULTS RETURNS EVERYTHING</text>

  <text x="40" y="76" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="#cbd5e1">similarity_top_k <tspan fill="#FF7A2A" font-weight="700">or</tspan> embedding_length</text>

  <!-- three lanes -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="13">

    <!-- lane 1: None -->
    <rect x="40" y="98" width="150" height="46" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <text x="115" y="120" fill="#94a3b8" text-anchor="middle">top_k = None</text>
    <text x="115" y="136" fill="#64748b" font-size="11" text-anchor="middle">&#8220;no limit&#8221;</text>

    <path d="M198 121 L288 121" stroke="#3f4653" stroke-width="2" stroke-linecap="round"/>
    <path d="M280 114 L288 121 L280 128" stroke="#3f4653" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="296" y="98" width="190" height="46" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <text x="391" y="126" fill="#94a3b8" text-anchor="middle">falsy &#8594; use fallback</text>

    <path d="M494 121 L584 121" stroke="#3f4653" stroke-width="2" stroke-linecap="round"/>
    <path d="M576 114 L584 121 L576 128" stroke="#3f4653" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="592" y="98" width="248" height="46" rx="8" fill="#101a17" stroke="#10b981"/>
    <text x="716" y="126" fill="#6ee7b7" text-anchor="middle">returns all 5 &#8212; correct</text>

    <!-- lane 2: 3 -->
    <rect x="40" y="160" width="150" height="46" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <text x="115" y="182" fill="#94a3b8" text-anchor="middle">top_k = 3</text>
    <text x="115" y="198" fill="#64748b" font-size="11" text-anchor="middle">&#8220;three, please&#8221;</text>

    <path d="M198 183 L288 183" stroke="#3f4653" stroke-width="2" stroke-linecap="round"/>
    <path d="M280 176 L288 183 L280 190" stroke="#3f4653" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="296" y="160" width="190" height="46" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <text x="391" y="188" fill="#94a3b8" text-anchor="middle">truthy &#8594; use 3</text>

    <path d="M494 183 L584 183" stroke="#3f4653" stroke-width="2" stroke-linecap="round"/>
    <path d="M576 176 L584 183 L576 190" stroke="#3f4653" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="592" y="160" width="248" height="46" rx="8" fill="#101a17" stroke="#10b981"/>
    <text x="716" y="188" fill="#6ee7b7" text-anchor="middle">returns 3 &#8212; correct</text>

    <!-- lane 3: 0 -->
    <rect x="40" y="222" width="150" height="46" rx="8" fill="#2a1418" stroke="#f87171"/>
    <text x="115" y="244" fill="#fca5a5" text-anchor="middle">top_k = 0</text>
    <text x="115" y="260" fill="#f87171" font-size="11" text-anchor="middle">&#8220;none, please&#8221;</text>

    <path d="M198 245 L288 245" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <path d="M280 238 L288 245 L280 252" stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="296" y="222" width="190" height="46" rx="8" fill="#2a1418" stroke="#f87171"/>
    <text x="391" y="244" fill="#fca5a5" text-anchor="middle">0 is falsy too &#8594;</text>
    <text x="391" y="260" fill="#f87171" font-size="11" text-anchor="middle">indistinguishable from None</text>

    <path d="M494 245 L584 245" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <path d="M576 238 L584 245 L576 252" stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="592" y="222" width="248" height="46" rx="8" fill="#2a1418" stroke="#f87171" stroke-width="2"/>
    <text x="716" y="244" fill="#fca5a5" text-anchor="middle" font-weight="700">returns all 5</text>
    <text x="716" y="260" fill="#f87171" font-size="11" text-anchor="middle">the exact opposite of the request</text>
  </g>

  <text x="440" y="304" font-family="system-ui,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">One value means &#8220;unset&#8221;. The other means &#8220;none&#8221;. Python&#8217;s <tspan font-family="ui-monospace,Consolas,monospace" fill="#fbbf24">or</tspan> cannot tell them apart.</text>
</svg>
