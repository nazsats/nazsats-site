<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="A try block meant to cover only a compatibility check also covers task execution, so the real error is swallowed and replaced by a misleading one.">
  <rect width="880" height="360" rx="14" fill="#0f1116"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">A TRY BLOCK THAT REACHES TOO FAR</text>

  <!-- intended scope -->
  <text x="40" y="76" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#34d399">What it was meant to catch</text>
  <rect x="40" y="88" width="380" height="52" rx="8" fill="#101a17" stroke="#10b981" stroke-dasharray="5 4"/>
  <text x="60" y="112" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#a7f3d0">try:  import tqdm.asyncio</text>
  <text x="60" y="130" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#6ee7b7">      # is the progress bar available?</text>

  <!-- actual scope -->
  <text x="460" y="76" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#f87171">What it actually catches</text>
  <rect x="460" y="88" width="380" height="96" rx="8" fill="#2a1418" stroke="#f87171"/>
  <text x="480" y="112" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#fca5a5">try:  import tqdm.asyncio</text>
  <text x="480" y="132" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#fca5a5">      await run_every_task()   &#8592;</text>
  <text x="480" y="152" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#f87171">except Exception: pass</text>
  <text x="480" y="172" font-family="system-ui,sans-serif" font-size="11.5" fill="#f87171">the work is inside the net too</text>

  <!-- sequence -->
  <text x="40" y="216" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#e2e8f0">So a failing task goes like this:</text>

  <g font-family="system-ui,sans-serif" font-size="12.5">
    <rect x="40" y="232" width="176" height="62" rx="9" fill="#1a1d25" stroke="#2b303c"/>
    <text x="128" y="256" fill="#fff" text-anchor="middle" font-weight="700">Task raises</text>
    <text x="128" y="275" fill="#fbbf24" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11.5">ValueError(&#8220;ORIGINAL&#8221;)</text>

    <rect x="240" y="232" width="176" height="62" rx="9" fill="#1a1d25" stroke="#2b303c"/>
    <text x="328" y="256" fill="#fff" text-anchor="middle" font-weight="700">Swallowed</text>
    <text x="328" y="275" fill="#94a3b8" text-anchor="middle" font-size="11.5">by the bare except</text>

    <rect x="440" y="232" width="176" height="62" rx="9" fill="#1a1d25" stroke="#2b303c"/>
    <text x="528" y="252" fill="#fff" text-anchor="middle" font-weight="700">Fallback re-runs</text>
    <text x="528" y="271" fill="#94a3b8" text-anchor="middle" font-size="11.5">but the coroutines</text>
    <text x="528" y="286" fill="#94a3b8" text-anchor="middle" font-size="11.5">are already spent</text>

    <rect x="640" y="232" width="200" height="62" rx="9" fill="#2a1418" stroke="#f87171" stroke-width="2"/>
    <text x="740" y="252" fill="#fca5a5" text-anchor="middle" font-weight="700">You see</text>
    <text x="740" y="272" fill="#f87171" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="10.5">RuntimeError: nested async</text>
    <text x="740" y="287" fill="#f87171" text-anchor="middle" font-size="11">&#8212; nothing to do with it</text>
  </g>

  <g stroke="#3f4653" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M222 263 L234 263"/>
    <path d="M422 263 L434 263"/>
    <path d="M622 263 L634 263"/>
  </g>

  <rect x="40" y="310" width="800" height="34" rx="8" fill="#171207" stroke="#4a2a0c"/>
  <text x="440" y="332" font-family="system-ui,sans-serif" font-size="13.5" fill="#fbbf24" text-anchor="middle">Turning on a progress bar changed which exception you get. That should never happen.</text>
</svg>
