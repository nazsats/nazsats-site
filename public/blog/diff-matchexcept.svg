<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Eight points with different payload shapes. Given the filter except one and two, local mode returns points 1, 3, 6 and 8, while the real server returns 1, 3 and 8. Point 6, whose value is an explicit null, is matched only by local mode.">
  <rect width="880" height="400" rx="14" fill="#0f1116"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">THE SAME FILTER, ASKED OF BOTH</text>
  <text x="40" y="72" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#cbd5e1">MatchExcept(<tspan fill="#FF7A2A">except=[1, 2]</tspan>) on key &#8220;multi&#8221;</text>

  <!-- column headers -->
  <text x="40" y="112" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4b5563">POINT</text>
  <text x="250" y="112" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4b5563">PAYLOAD</text>
  <text x="560" y="112" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4b5563">LOCAL</text>
  <text x="700" y="112" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#4b5563">SERVER</text>

  <g font-family="ui-monospace,Consolas,monospace" font-size="12.5">
    <!-- row 1 -->
    <text x="40" y="146" fill="#94a3b8">1</text>
    <text x="250" y="146" fill="#94a3b8">{"multi": [1, 5]}</text>
    <text x="566" y="146" fill="#22c55e">match</text>
    <text x="706" y="146" fill="#22c55e">match</text>

    <!-- row 2 -->
    <text x="40" y="176" fill="#94a3b8">2</text>
    <text x="250" y="176" fill="#94a3b8">{"multi": [1, 2]}</text>
    <text x="566" y="176" fill="#4b5563">&#8212;</text>
    <text x="706" y="176" fill="#4b5563">&#8212;</text>

    <!-- row 3 -->
    <text x="40" y="206" fill="#94a3b8">3</text>
    <text x="250" y="206" fill="#94a3b8">{"multi": [5, 6]}</text>
    <text x="566" y="206" fill="#22c55e">match</text>
    <text x="706" y="206" fill="#22c55e">match</text>

    <!-- row 6 — the divergence -->
    <rect x="30" y="222" width="820" height="34" rx="6" fill="#2a1509" stroke="#FF7A2A"/>
    <text x="40" y="245" fill="#FF7A2A" font-weight="700">6</text>
    <text x="250" y="245" fill="#FF7A2A" font-weight="700">{"multi": null}</text>
    <text x="566" y="245" fill="#FF7A2A" font-weight="700">match</text>
    <text x="706" y="245" fill="#f87171" font-weight="700">&#8212;</text>

    <!-- row 8 -->
    <text x="40" y="282" fill="#94a3b8">8</text>
    <text x="250" y="282" fill="#94a3b8">{"multi": 5}</text>
    <text x="566" y="282" fill="#22c55e">match</text>
    <text x="706" y="282" fill="#22c55e">match</text>
  </g>

  <line x1="30" y1="304" x2="850" y2="304" stroke="#2b303c" stroke-width="1"/>

  <text x="40" y="332" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#94a3b8">local  &#8594; <tspan fill="#cbd5e1">[1, 3, 6, 8]</tspan></text>
  <text x="40" y="354" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#94a3b8">server &#8594; <tspan fill="#cbd5e1">[1, 3, 8]</tspan></text>

  <text x="430" y="344" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">One id apart. No error, no warning &#8212; just a different answer to the same question.</text>
</svg>
