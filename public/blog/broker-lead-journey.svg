<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="A lead's journey through seven stages from New to Won or Lost, with automatic reminders if a lead goes quiet.">
  <rect width="900" height="300" rx="14" fill="#0f1116"/>

  <text x="40" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">THE JOURNEY OF ONE BUYER</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" text-anchor="middle">
    <!-- stage pills, deepening colour along the pipeline -->
    <g>
      <rect x="40"  y="86" width="104" height="46" rx="23" fill="#1e2a3a" stroke="#3b5573"/>
      <text x="92"  y="114" fill="#cbd5e1" font-weight="700">New</text>
    </g>
    <g>
      <rect x="160" y="86" width="104" height="46" rx="23" fill="#22334a" stroke="#43608a"/>
      <text x="212" y="114" fill="#cbd5e1" font-weight="700">Contacted</text>
    </g>
    <g>
      <rect x="280" y="86" width="104" height="46" rx="23" fill="#263c5c" stroke="#4a6ea3"/>
      <text x="332" y="114" fill="#e2e8f0" font-weight="700">Qualified</text>
    </g>
    <g>
      <rect x="400" y="86" width="104" height="46" rx="23" fill="#2a456d" stroke="#527bb8"/>
      <text x="452" y="114" fill="#e2e8f0" font-weight="700">Viewing</text>
    </g>
    <g>
      <rect x="520" y="86" width="104" height="46" rx="23" fill="#2e4e7e" stroke="#5a87cd"/>
      <text x="572" y="114" fill="#fff" font-weight="700">Negotiation</text>
    </g>
    <g>
      <rect x="648" y="60" width="104" height="46" rx="23" fill="#0f3a2b" stroke="#10b981"/>
      <text x="700" y="88" fill="#6ee7b7" font-weight="800">✓  Won</text>
    </g>
    <g>
      <rect x="648" y="120" width="104" height="46" rx="23" fill="#3a1518" stroke="#ef4444"/>
      <text x="700" y="148" fill="#fca5a5" font-weight="800">✕  Lost</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#3f4653" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M148 109 L156 109"/>
    <path d="M268 109 L276 109"/>
    <path d="M388 109 L396 109"/>
    <path d="M508 109 L516 109"/>
    <path d="M628 109 Q638 109 638 96 L638 83 L644 83"/>
    <path d="M628 109 Q638 109 638 130 L638 143 L644 143"/>
  </g>

  <!-- reminder band -->
  <rect x="40" y="182" width="820" height="86" rx="10" fill="#171207" stroke="#4a2a0c"/>
  <text x="450" y="209" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">If a buyer goes quiet, the app tells you — you don't have to remember</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13.5" fill="#cbd5e1" text-anchor="middle">
    <text x="200" y="238">New — no reply for <tspan font-weight="800" fill="#FF7A2A">1 day</tspan></text>
    <text x="450" y="238">Contacted — <tspan font-weight="800" fill="#FF7A2A">2 days</tspan></text>
    <text x="700" y="238">Qualified — <tspan font-weight="800" fill="#FF7A2A">3 days</tspan></text>
  </g>
  <text x="450" y="260" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">…and they appear at the top of your Today list</text>
</svg>
