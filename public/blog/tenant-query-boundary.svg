<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Query-level isolation: the tenant id is taken from the authenticated session and passed as a separate argument to the retrieval function, alongside the arguments the model chose. The SQL filter applies the tenant id, so only that tenant's rows are ever returned and the model never sees anything else.">
  <rect width="880" height="380" rx="14" fill="#FFFFFF" stroke="#E6E3DF"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#7C7873">WHERE THE BOUNDARY BELONGS</text>

  <!-- session -->
  <rect x="40" y="80" width="188" height="66" rx="8" fill="#F1EFEC" stroke="#E6E3DF"/>
  <text x="134" y="104" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1A1815" text-anchor="middle">authenticated session</text>
  <text x="134" y="126" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#C2410C" text-anchor="middle">user.agency_id</text>

  <!-- model -->
  <rect x="40" y="176" width="188" height="66" rx="8" fill="#F1EFEC" stroke="#E6E3DF"/>
  <text x="134" y="200" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1A1815" text-anchor="middle">the model</text>
  <text x="134" y="222" font-family="ui-monospace,Consolas,monospace" font-size="11.5" fill="#3D3A35" text-anchor="middle">beds, price, area&#8230;</text>

  <!-- arrows into the function -->
  <path d="M236 113 C 280 113, 280 148, 322 148" stroke="#C2410C" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M314 141 L322 148 L314 155" stroke="#C2410C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M236 209 C 280 209, 280 174, 322 174" stroke="#7C7873" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M314 167 L322 174 L314 181" stroke="#7C7873" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the function -->
  <rect x="330" y="104" width="320" height="114" rx="8" fill="#FDFCFB" stroke="#C2410C" stroke-width="1.5"/>
  <text x="490" y="128" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1A1815" text-anchor="middle">the retrieval function</text>
  <text x="490" y="154" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#C2410C" text-anchor="middle">fetch(session, agency_id, **args)</text>
  <text x="490" y="176" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#7C7873" text-anchor="middle">tenant is a separate parameter, not part of **args</text>
  <text x="490" y="198" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#7C7873" text-anchor="middle">the model cannot reach it, forge it, or argue with it</text>

  <!-- arrow to sql -->
  <path d="M658 161 L716 161" stroke="#3D3A35" stroke-width="2" stroke-linecap="round"/>
  <path d="M708 154 L716 161 L708 168" stroke="#3D3A35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- db -->
  <rect x="724" y="104" width="116" height="114" rx="8" fill="#F1EFEC" stroke="#E6E3DF"/>
  <text x="782" y="128" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1A1815" text-anchor="middle">Postgres</text>
  <text x="782" y="152" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#3D3A35" text-anchor="middle">WHERE</text>
  <text x="782" y="168" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#3D3A35" text-anchor="middle">agency_id =</text>
  <text x="782" y="184" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#3D3A35" text-anchor="middle">:agency_id</text>
  <text x="782" y="206" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#7C7873" text-anchor="middle">+ index</text>

  <!-- return -->
  <path d="M782 226 L782 262 L490 262 L490 282" stroke="#3D3A35" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M483 274 L490 282 L497 274" stroke="#3D3A35" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="330" y="290" width="320" height="46" rx="8" fill="#F1EFEC" stroke="#E6E3DF"/>
  <text x="490" y="318" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#1A1815" text-anchor="middle">only this tenant&#8217;s rows ever exist in the response</text>

  <text x="40" y="318" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#7C7873">A prompt-injected</text>
  <text x="40" y="336" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#7C7873">request changes</text>
  <text x="40" y="354" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#7C7873">**args, never the id.</text>
</svg>
