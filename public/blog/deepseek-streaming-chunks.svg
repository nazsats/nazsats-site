<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="A streaming response arrives as content chunks that each carry a choices entry, followed by a final chunk that carries usage but no choices. Because the usage arrives in that choices-free chunk, the cache mapping cannot be placed inside the code branch that requires choices.">
  <rect width="900" height="330" rx="14" fill="#0f1116"/>

  <text x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">WHERE THE USAGE ACTUALLY ARRIVES</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#94a3b8">A streamed DeepSeek reply, chunk by chunk</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">

    <!-- chunks -->
    <rect x="40" y="94" width="170" height="86" rx="9" fill="#1a1d25" stroke="#2b303c"/>
    <text x="58" y="118" font-size="11.5" font-weight="700" fill="#64748b">CHUNK 1</text>
    <text x="58" y="140" font-size="12" fill="#10b981">choices &#10003;</text>
    <text x="58" y="160" font-size="12" fill="#64748b">usage &#10007;</text>
    <text x="58" y="176" font-size="11" fill="#94a3b8">content: "Hi"</text>

    <path d="M 210 137 L 238 137" stroke="#2b303c" stroke-width="2"/>
    <path d="M 232 131 L 240 137 L 232 143 Z" fill="#2b303c"/>

    <rect x="244" y="94" width="170" height="86" rx="9" fill="#1a1d25" stroke="#2b303c"/>
    <text x="262" y="118" font-size="11.5" font-weight="700" fill="#64748b">CHUNK 2</text>
    <text x="262" y="140" font-size="12" fill="#10b981">choices &#10003;</text>
    <text x="262" y="160" font-size="12" fill="#64748b">usage &#10007;</text>
    <text x="262" y="176" font-size="11" fill="#94a3b8">content: " there"</text>

    <path d="M 414 137 L 442 137" stroke="#2b303c" stroke-width="2"/>
    <path d="M 436 131 L 444 137 L 436 143 Z" fill="#2b303c"/>

    <text x="458" y="140" font-size="16" fill="#64748b">&#8230;</text>

    <path d="M 486 137 L 514 137" stroke="#FF5500" stroke-width="2"/>
    <path d="M 508 131 L 516 137 L 508 143 Z" fill="#FF5500"/>

    <!-- trailing chunk -->
    <rect x="520" y="94" width="200" height="86" rx="9" fill="#1f1508" stroke="#FF5500"/>
    <text x="540" y="118" font-size="11.5" font-weight="700" fill="#FF5500">FINAL CHUNK</text>
    <text x="540" y="140" font-size="12" font-weight="700" fill="#FF5500">choices = []</text>
    <text x="540" y="160" font-size="12" font-weight="700" fill="#10b981">usage &#10003;</text>
    <text x="540" y="176" font-size="11" fill="#94a3b8">cache_hit_tokens: 64</text>

    <!-- consequence -->
    <rect x="40" y="204" width="820" height="98" rx="10" fill="#101013" stroke="#FF5500"/>
    <text x="64" y="230" font-size="12.5" font-weight="800" fill="#FF5500">The numbers arrive in the one chunk that has no choices.</text>
    <text x="64" y="254" font-size="12.5" fill="#94a3b8">So the mapping cannot live inside the existing branch, because that branch never runs for this chunk:</text>
    <text x="64" y="278" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#e2e8f0">if (choices := chunk.get("choices")) and generation_chunk:   <tspan fill="#64748b"># skipped — choices is empty</tspan></text>
    <text x="64" y="296" font-size="11.5" fill="#94a3b8">It has to be applied before that check. This is the part you only find by streaming a real response.</text>
  </g>
</svg>
