<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Timeline: issue and PR filed on 29 July within four minutes; a competing PR arrived on 31 July; the earlier PR was merged on 3 August and the competing one closed.">
  <rect width="880" height="400" rx="14" fill="#0f1116"/>

  <text x="40" y="44" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">TWO PULL REQUESTS, ONE BUG</text>

  <!-- timeline spine -->
  <line x1="120" y1="92" x2="120" y2="330" stroke="#2b303c" stroke-width="3" stroke-linecap="round"/>

  <!-- 29 Jul: issue -->
  <circle cx="120" cy="104" r="9" fill="#0f1116" stroke="#FF5500" stroke-width="3.5"/>
  <text x="150" y="98" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#64748b">29 Jul · 17:09</text>
  <text x="150" y="120" font-family="system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#fff">I file issue #1292</text>

  <!-- 29 Jul: my PR -->
  <circle cx="120" cy="164" r="9" fill="#0f1116" stroke="#FF5500" stroke-width="3.5"/>
  <text x="150" y="158" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#64748b">29 Jul · 17:13</text>
  <text x="150" y="180" font-family="system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#fff">I open PR #1293
    <tspan font-weight="400" fill="#94a3b8"> — four minutes later</tspan>
  </text>

  <!-- gap marker -->
  <text x="150" y="212" font-family="system-ui,sans-serif" font-size="13" fill="#475569" font-style="italic">…two days pass…</text>

  <!-- 31 Jul: competing PR -->
  <circle cx="120" cy="240" r="9" fill="#0f1116" stroke="#f87171" stroke-width="3.5"/>
  <text x="150" y="234" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#64748b">31 Jul · 16:49</text>
  <text x="150" y="256" font-family="system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#fca5a5">Someone else opens PR #1301
  </text>
  <text x="150" y="276" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">same bug, same two files, citing my issue</text>

  <!-- 3 Aug: merged -->
  <circle cx="120" cy="318" r="9" fill="#10b981" stroke="#10b981" stroke-width="3.5"/>
  <text x="150" y="312" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#64748b">3 Aug · 18:25</text>
  <text x="150" y="334" font-family="system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#6ee7b7">#1293 merged · #1301 closed</text>

  <!-- verdict panel -->
  <rect x="520" y="88" width="320" height="252" rx="12" fill="#101a17" stroke="#1f513f"/>
  <text x="548" y="122" font-family="system-ui,sans-serif" font-size="14" font-weight="800" fill="#34d399">WHY MINE, NOT THEIRS</text>

  <text x="548" y="158" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">1 · It existed first</text>
  <text x="548" y="178" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">Two days of head start</text>

  <text x="548" y="212" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">2 · It tested against the server</text>
  <text x="548" y="232" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">A congruence test, not an assertion</text>

  <text x="548" y="266" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff">3 · The issue came first</text>
  <text x="548" y="286" font-family="system-ui,sans-serif" font-size="12.5" fill="#a7f3d0">The bug was already agreed on</text>

  <text x="548" y="322" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="#64748b">+74 / −9 · 2 files · squash 962d8f4</text>
</svg>
