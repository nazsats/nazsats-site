<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Two reliability curves. Before calibration the model's stated probabilities sit away from the diagonal, so a stated 30 percent means about 45 percent in reality. After isotonic calibration the curve follows the diagonal and the numbers mean what they say. Ranking ability is unchanged at 0.672 in both.">
  <rect width="900" height="340" rx="14" fill="#0f1116"/>

  <text x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">DOES &quot;30% CHANCE&quot; ACTUALLY MEAN 30%?</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#94a3b8">Stated probability plotted against what really happened</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">

    <!-- BEFORE -->
    <text x="120" y="100" font-size="12" font-weight="700" letter-spacing="1" fill="#f59e0b">BEFORE</text>
    <rect x="120" y="112" width="180" height="180" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <line x1="120" y1="292" x2="300" y2="112" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 120 292 C 150 250, 175 196, 210 178 C 245 160, 275 138, 300 112"
          fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="174" cy="226" r="4" fill="#f59e0b"/>
    <line x1="174" y1="226" x2="174" y2="256" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="174" y="272" font-size="11" fill="#f59e0b" text-anchor="middle">says 30%</text>
    <text x="174" y="286" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">really 45%</text>

    <!-- AFTER -->
    <text x="500" y="100" font-size="12" font-weight="700" letter-spacing="1" fill="#10b981">AFTER</text>
    <rect x="500" y="112" width="180" height="180" rx="8" fill="#1a1d25" stroke="#2b303c"/>
    <line x1="500" y1="292" x2="680" y2="112" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 500 292 C 536 258, 572 220, 608 184 C 632 160, 656 136, 680 112"
          fill="none" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="554" cy="244" r="4" fill="#10b981"/>
    <line x1="554" y1="244" x2="554" y2="256" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="554" y="272" font-size="11" fill="#10b981" text-anchor="middle">says 30%</text>
    <text x="554" y="286" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">really 30%</text>

    <!-- axis hints -->
    <text x="210" y="310" font-size="10.5" fill="#64748b" text-anchor="middle">stated probability →</text>
    <text x="590" y="310" font-size="10.5" fill="#64748b" text-anchor="middle">stated probability →</text>

    <!-- arrow between -->
    <path d="M 330 202 L 468 202" stroke="#2b303c" stroke-width="2"/>
    <path d="M 462 196 L 470 202 L 462 208 Z" fill="#2b303c"/>
    <text x="399" y="192" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle">isotonic</text>
    <text x="399" y="222" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle">calibration</text>

    <!-- metrics panel -->
    <rect x="712" y="112" width="148" height="180" rx="8" fill="#101a17" stroke="#10b981"/>
    <text x="730" y="140" font-size="11" font-weight="700" letter-spacing="1" fill="#64748b">RANKING (AUC)</text>
    <text x="730" y="164" font-size="16" font-weight="800" fill="#e2e8f0">0.672</text>
    <text x="730" y="182" font-size="11" fill="#64748b">unchanged</text>

    <text x="730" y="216" font-size="11" font-weight="700" letter-spacing="1" fill="#64748b">CALIBRATION ERROR</text>
    <text x="730" y="242" font-size="16" font-weight="800" fill="#f59e0b">0.0400</text>
    <text x="792" y="242" font-size="13" fill="#64748b">→</text>
    <text x="812" y="242" font-size="16" font-weight="800" fill="#10b981">0.016</text>
    <text x="730" y="262" font-size="11.5" font-weight="700" fill="#10b981">2.5× better</text>
  </g>

  <line x1="40" y1="316" x2="860" y2="316" stroke="#2b303c" stroke-width="1"/>
</svg>
