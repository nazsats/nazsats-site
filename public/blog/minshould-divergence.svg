<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="A comparison of how local mode and a real Qdrant server handle min_count values from minus two to three. For minus two, minus one and zero the server rejects the request with 400 or 422 while local mode returns every point in the collection. For one, two and three both behave correctly.">
  <rect width="900" height="330" rx="14" fill="#0f1116"/>

  <text x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">WHERE LOCAL MODE AND THE SERVER DISAGREE</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#94a3b8">min_should with min_count, two conditions, three points. Qdrant 1.19.0 in Docker.</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">

    <!-- divergence zone -->
    <rect x="150" y="96" width="330" height="176" rx="8" fill="#1c1418" stroke="#4c1d24"/>
    <text x="315" y="292" font-size="11.5" font-weight="700" letter-spacing="1" fill="#b45309" text-anchor="middle">SILENTLY WRONG</text>
    <text x="690" y="292" font-size="11.5" font-weight="700" letter-spacing="1" fill="#3f6212" text-anchor="middle">AGREES</text>

    <!-- column headers -->
    <text x="88" y="120" font-size="11.5" font-weight="700" letter-spacing="1" fill="#64748b">min_count</text>
    <text x="205" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">-2</text>
    <text x="315" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">-1</text>
    <text x="425" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">0</text>
    <text x="535" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">1</text>
    <text x="645" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">2</text>
    <text x="755" y="120" font-size="13" fill="#e2e8f0" text-anchor="middle">3</text>

    <!-- local mode lane -->
    <text x="40" y="172" font-size="11.5" font-weight="700" letter-spacing="1" fill="#64748b">LOCAL MODE</text>
    <rect x="160" y="152" width="90" height="30" rx="4" fill="#2a1216" stroke="#7f1d1d"/>
    <rect x="270" y="152" width="90" height="30" rx="4" fill="#2a1216" stroke="#7f1d1d"/>
    <rect x="380" y="152" width="90" height="30" rx="4" fill="#2a1216" stroke="#7f1d1d"/>
    <text x="205" y="172" font-size="11" fill="#fca5a5" text-anchor="middle">everything</text>
    <text x="315" y="172" font-size="11" fill="#fca5a5" text-anchor="middle">everything</text>
    <text x="425" y="172" font-size="11" fill="#fca5a5" text-anchor="middle">everything</text>
    <rect x="490" y="152" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="600" y="152" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="710" y="152" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <text x="535" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>
    <text x="645" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>
    <text x="755" y="172" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>

    <!-- server lane -->
    <text x="40" y="232" font-size="11.5" font-weight="700" letter-spacing="1" fill="#64748b">SERVER</text>
    <rect x="160" y="212" width="90" height="30" rx="4" fill="#12211a" stroke="#14532d"/>
    <rect x="270" y="212" width="90" height="30" rx="4" fill="#12211a" stroke="#14532d"/>
    <rect x="380" y="212" width="90" height="30" rx="4" fill="#12211a" stroke="#14532d"/>
    <text x="205" y="232" font-size="11" fill="#86efac" text-anchor="middle">400</text>
    <text x="315" y="232" font-size="11" fill="#86efac" text-anchor="middle">400</text>
    <text x="425" y="232" font-size="11" fill="#86efac" text-anchor="middle">422</text>
    <rect x="490" y="212" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="600" y="212" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="710" y="212" width="90" height="30" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <text x="535" y="232" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>
    <text x="645" y="232" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>
    <text x="755" y="232" font-size="11" fill="#94a3b8" text-anchor="middle">correct</text>

  </g>
</svg>
