<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="One aircraft flying four legs in a day. A twenty minute delay on the first leg grows to fifty-five minutes by the fourth, because each departure waits for the same aircraft to arrive.">
  <rect width="900" height="300" rx="14" fill="#0f1116"/>

  <text x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">HOW ONE DELAY BECOMES FOUR</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#94a3b8">The same aircraft flies four legs. Every later departure waits for it.</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">

    <!-- scheduled baseline -->
    <text x="40" y="112" font-size="11.5" font-weight="700" letter-spacing="1" fill="#64748b">SCHEDULED</text>
    <rect x="150" y="98" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="320" y="98" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="490" y="98" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="660" y="98" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <text x="225" y="112" font-size="11.5" fill="#64748b" text-anchor="middle">leg 1</text>
    <text x="395" y="112" font-size="11.5" fill="#64748b" text-anchor="middle">leg 2</text>
    <text x="565" y="112" font-size="11.5" fill="#64748b" text-anchor="middle">leg 3</text>
    <text x="735" y="112" font-size="11.5" fill="#64748b" text-anchor="middle">leg 4</text>

    <!-- actual, drifting right -->
    <text x="40" y="180" font-size="11.5" font-weight="700" letter-spacing="1" fill="#64748b">ACTUAL</text>

    <rect x="150" y="166" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="300" y="166" width="22" height="20" rx="4" fill="#f59e0b" opacity="0.5"/>
    <text x="225" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">leg 1</text>

    <rect x="342" y="166" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="492" y="166" width="30" height="20" rx="4" fill="#f59e0b" opacity="0.65"/>
    <text x="417" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">leg 2</text>

    <rect x="542" y="166" width="150" height="20" rx="4" fill="#1a1d25" stroke="#2b303c"/>
    <rect x="692" y="166" width="40" height="20" rx="4" fill="#FF5500" opacity="0.8"/>
    <text x="617" y="180" font-size="11.5" fill="#94a3b8" text-anchor="middle">leg 3</text>

    <rect x="752" y="166" width="108" height="20" rx="4" fill="#1a1d25" stroke="#FF5500"/>
    <text x="806" y="180" font-size="11.5" fill="#fff" text-anchor="middle">leg 4</text>

    <!-- growing delay callouts -->
    <text x="311" y="206" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">+20</text>
    <text x="507" y="206" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">+30</text>
    <text x="712" y="206" font-size="12" font-weight="700" fill="#FF5500" text-anchor="middle">+42</text>
    <text x="806" y="206" font-size="13" font-weight="800" fill="#FF5500" text-anchor="middle">+55 min</text>

    <text x="311" y="224" font-size="10.5" fill="#64748b" text-anchor="middle">min late</text>
    <text x="806" y="224" font-size="10.5" fill="#94a3b8" text-anchor="middle">by the last leg</text>
  </g>

  <line x1="40" y1="246" x2="860" y2="246" stroke="#2b303c" stroke-width="1"/>
  <text x="40" y="274" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#94a3b8">Only the first delay had a cause of its own. The other three are recorded as <tspan fill="#10b981" font-weight="700">late-arriving aircraft</tspan> — the single largest category in the data.</text>
</svg>
